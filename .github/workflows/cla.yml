name: CLA

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  agreement:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && contains(github.event.comment.body, 'I agree to the Contributor Licence Agreement'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request ?? (await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number })).data;
            if (pr.state !== 'open') return;

            const report = (state, description) =>
              github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: pr.head.sha,
                state,
                context: 'CLA',
                description: description.slice(0, 140),
                target_url: `${context.serverUrl}/${owner}/${repo}/blob/master/CLA.md`,
              });

            const automated = ['dependabot[bot]', 'github-actions[bot]'].includes(pr.user.login);
            if (!automated && !/^\s*[-*] \[x\] I have read the \[Contributor Licence Agreement\]/im.test(pr.body ?? '')) {
              return report('failure', 'Tick the Contributor Licence Agreement box in the pull request description');
            }
            if (pr.commits > 250) {
              return report('failure', 'Too many commits to check. Reduce the pull request to 250 commits or fewer');
            }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
            const statement = /^\s*I agree to the Contributor Licence Agreement\.?\s*$/i;
            const agreed = new Set(comments.filter((c) => statement.test(c.body ?? '')).map((c) => c.user.login));
            agreed.add(pr.user.login);

            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number, per_page: 100 });
            const logins = new Set();
            const unlinked = new Map();
            for (const c of commits) {
              for (const [account, identity] of [
                [c.author, c.commit.author],
                [c.committer, c.commit.committer],
              ]) {
                if (account) logins.add(account.login);
                else unlinked.set(identity.name, `${identity.name} <${identity.email}>`);
              }
              for (const m of c.commit.message.matchAll(/^Co-authored-by:\s*(.+?)\s*<([^>]+)>/gim)) {
                const noreply = m[2].match(/^(?:\d+\+)?([^@]+)@users\.noreply\.github\.com$/i);
                if (noreply) logins.add(noreply[1]);
                else unlinked.set(m[1], `${m[1]} <${m[2]}>`);
              }
            }
            logins.delete('web-flow');

            const missing = [];
            for (const login of logins) {
              if (agreed.has(login)) continue;
              const type = await github.rest.users.getByUsername({ username: login }).then((r) => r.data.type, () => 'User');
              if (type !== 'Bot') missing.push(login);
            }

            if (pr.user.type === 'Bot' && !automated && ![...agreed].some((l) => l !== pr.user.login)) {
              missing.push('a person responsible for this automated pull request');
            }
            if (missing.length) {
              return report('failure', `Missing CLA agreement from: ${missing.join(', ')}`);
            }

            if (unlinked.size && !pr.labels.some((l) => l.name === 'CLA verified')) {
              core.warning(`Commit identities not linked to a GitHub account: ${[...unlinked.values()].join(', ')}`);
              return report('failure', `A maintainer must verify these contributors and add the CLA verified label: ${[...unlinked.keys()].join(', ')}`);
            }
            return report('success', 'All contributors agreed to the Contributor Licence Agreement');
