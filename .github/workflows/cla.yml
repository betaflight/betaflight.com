name: CLA

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  agreement:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check the agreement box is ticked
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$PR_BODY" | grep -Eiq '^[[:space:]]*[-*] \[x\] I have read the \[Contributor Licence Agreement\]'; then
            echo "Contributor Licence Agreement accepted."
          else
            echo "::error::Tick the Contributor Licence Agreement box in the pull request description."
            exit 1
          fi
