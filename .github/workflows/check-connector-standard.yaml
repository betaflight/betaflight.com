name: Check connector standard renders

on:
  pull_request:
    paths:
      - 'src/hardware/connector-standard/**'
      - 'tools/render_connector_standard.mjs'
      - 'static/img/connector_standard/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-connector-standard.yaml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.0-full

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate crop areas
        run: npm run validate:connector-standard

      - name: Check generated assets
        run: npm run check:connector-standard
