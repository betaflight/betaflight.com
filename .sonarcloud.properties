# `static/diagrams/` holds standalone interactive diagrams generated by archify and
# committed as-is (they are also excluded from Prettier). Each file bundles the
# generator's own viewer CSS and JS, so analysis would report against vendored
# output that is replaced wholesale on regeneration rather than edited by hand.
# Automatic Analysis ignores sonar.issue.ignore.multicriteria, leaving a file
# exclusion as the only in-repo lever.
sonar.exclusions=static/diagrams/**
sonar.cpd.exclusions=static/diagrams/**
